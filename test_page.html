<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>test_Document</title>
    <style>
        #openlogin{
            color: rgb(33, 102, 104);
            background-color: rgb(16, 201, 201);
            padding: 12px 24px;
            border: none;
            justify-content: center;

        }
        .logging{
            place-items: center;
            display:grid ;
            height:100vh;
        }
        .model-close {
        position: absolute; top: 10px; right: 10px;
        border: none; background: none; font-size: 20px; cursor: pointer;
        }
        .modle-overlay {
        position: fixed; top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0,0,0,0.5);
        display: none; justify-content: center; align-items: center;
    }
    
    .modal {
        background: rgb(183, 121, 121); padding: 30px; border-radius: 8px;
        width: 300px; position: relative;
    }
    </style>
</head>
<body>
    <div class='logging'>
        <button id="openlogin">点击登录</button>
    </div>
    <div class="modle-overlay" id="overlay">
        <div class="modal">
            <button type='button' class="model-close" id="close-btn">x</button>
            <form action="#" method="post">
                <label for="username">用户名：</label>
                <input type="text"id="username" name="username" placeholder="请输入用户名"><br><br>
                <label for="password">密码：  </label>
                <input type="password" name="password"  id="password" placeholder="请输入密码">
            
            </form>
        </div>
    </div>
</body>
<script>
    const overlay=document.getElementById('overlay');
    document.getElementById('openlogin').onclick = () => overlay.style.display = 'flex';
    document.getElementById('close-btn').onclick = () => overlay.style.display = 'none';
    overlay.onclick = (e) => {
        if (e.target === overlay) overlay.style.display = 'none';
    };
</script>
</html>
